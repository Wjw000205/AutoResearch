[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-lab"
version = "0.1.0"
description = "A durable local multi-provider research laboratory"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "psutil>=6,<8", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "jsonschema>=4.23,<5", "pypdf>=5,<7", "python-multipart>=0.0.18,<1", "packaging>=24,<27", "langgraph>=1.2.12,<2", "langgraph-checkpoint-sqlite>=3.1.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
literature = ["fastembed>=0.8.1,<0.9", "rapidocr>=3.9.2,<4", "onnxruntime>=1.20,<2", "pymupdf>=1.24,<2", "Pillow>=10,<13", "numpy>=1.26,<2", "opencv-python>=4.8,<4.12", "protobuf>=4.25.8,<6"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["autoresearch*"]

[tool.setuptools.package-data]
autoresearch = ["ccf_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
